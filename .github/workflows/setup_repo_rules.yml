jobs:
  apply-branch-protection:
    runs-on: ubuntu-latest
    steps:
      - name: Apply Branch Protection Rule
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          REPO: ${{ github.repository }}
        run: |
          # Monta o corpo JSON em uma variável
          BODY=$(cat <<EOF
          {
            "required_status_checks": {
              "strict": true,
              "checks": [
                {
                  "context": "scan-and-remediate"
                }
              ]
            },
            "enforce_admins": true,
            "required_pull_request_reviews": null,
            "restrictions": null
          }
          EOF
          )

          # Envia o JSON para a API via standard input (--input -)
          echo "$BODY" | gh api \
            --method PUT "/repos/${REPO}/branches/main/protection" \
            --input -

          echo "Regra de proteção para o branch 'main' aplicada com sucesso."