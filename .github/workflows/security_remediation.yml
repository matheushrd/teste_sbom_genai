name: GenAI Security Auto-Remediation on PR

on:
  pull_request:
    branches: ['main']
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  scan-and-remediate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./app

    steps:
    
      - name: 1. Checkout do código-fonte
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: 2. Ler configuração do pipeline
        id: config
        run: |
          echo "python_version=$(yq '.python_version' ../ci_config.yml)" >> "$GITHUB_OUTPUT"
          echo "requirements_file=$(yq '.requirements_files[0]' ../ci_config.yml)" >> "$GITHUB_OUTPUT"
          echo "test_requirements_file=$(yq '.requirements_files[1]' ../ci_config.yml)" >> "$GITHUB_OUTPUT"

      - name: 2.5. Rodar testes antes da verificação
        run: |
          pip install -r ${{ steps.config.outputs.test_requirements_file }}
          pytest tests/

      - name: 3. Setup do ambiente Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.config.outputs.python_version }}
          cache: 'pip'
          cache-dependency-path: app/${{ steps.config.outputs.requirements_file }}

      - name: 4. Instalar dependências
        run: |
          # Apenas instala as dependências. O 'pip freeze' não é necessário.
          pip install -r ${{ steps.config.outputs.requirements_file }}
          pip install cyclonedx-bom # Instala a ferramenta para a próxima etapa

      - name: 4.1 Gerar SBOM com CycloneDX
        run: |
          # Cria o diretório e gera o SBOM diretamente do requirements.txt
          mkdir -p app
          cyclonedx-py requirements -i ${{ steps.config.outputs.requirements_file }} -o ./app/cyclonedx.json

      - name: 4.2 Validar SBOM (Método Manual)
        run: |
          # Baixa a ferramenta de linha de comando (CLI) do CycloneDX
          curl -L -o cyclonedx-cli https://github.com/CycloneDX/cyclonedx-cli/releases/latest/download/cyclonedx-linux-x64

          # Dá permissão de execução para a ferramenta
          chmod +x cyclonedx-cli

          # Executa a validação no seu arquivo SBOM
          ./cyclonedx-cli validate --input-file ./app/cyclonedx.json

      - name: 4.3. Carregar SBOM como Artefato
        uses: actions/upload-artifact@v4
        with:
          name: sbom-artifact # Nome do artefato
          path: ./app/cyclonedx.json # Caminho do arquivo a ser salvo

      - name: 4.3.1. Verificar arquivos existentes
        run: ls -R ./app

      # - name: 5. Escanear SBOM com Trivy
      #   id: vulerability_scan
      #   uses: aquasecurity/trivy-action@master
      #   with:
      #     # A linha 'scan-ref' foi REMOVIDA.
      #     scan-type: 'sbom'
      #     input: './app/cyclonedx.json'
      #     format: 'json'
      #     output: 'trivy-results.json'
      #     severity: 'HIGH,CRITICAL'
      #     ignore-unfixed: true

      - name: 5.1. Baixar Artefato do SBOM
        uses: actions/download-artifact@v4
        with:
          name: cyclonedx.json # Mesmo nome usado no upload
          path: ./app # Diretório onde o artefato será extraído

      - name: 5.1.1. Verificar arquivos existentes
        run: ls -R ./app

      - name: 5.2. Escanear SBOM com Grype
        id: vulerability_scan
        uses: anchore/scan-action@v6
        with:
          sbom: './app/cyclonedx.json'
          fail-on-severity: 'medium'
          
      - name: 6. Gemini sugere e aplica a correção com OSV
        id: genai_fix
        # Certifique-se de que o nome do step anterior seja 'osv_scan'
        if: steps.trivy_scan.outcome == 'failure' 
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          REQUIREMENTS_FILE_PATH: app/${{ steps.config.outputs.requirements_file }}
        run: |
          pip install google-generativeai
          python - << 'EOF'
          import os, json, google.generativeai as genai, subprocess

          requirements_path = os.environ["REQUIREMENTS_FILE_PATH"]
          pkg_name, installed_version, cve_id = None, None, None

          try:
              # Assume que o resultado do OSV está em 'osv-results.json'
              with open('osv-results.json', 'r') as f: data = json.load(f)
              
              # Itera sobre a estrutura do JSON do OSV para encontrar a primeira vulnerabilidade
              for result in data.get('results', []):
                  for pkg_group in result.get('packages', []):
                      if pkg_group.get('vulnerabilities'):
                          pkg_info = pkg_group['package']
                          vulnerability = pkg_group['vulnerabilities'][0]
                          pkg_name = pkg_info.get('name')
                          installed_version = pkg_info.get('version')
                          cve_id = vulnerability.get('id')
                          print(f"Vulnerabilidade encontrada: {cve_id} em {pkg_name}=={installed_version}")
                          break
                  if cve_id:
                      break
          except (IOError, IndexError, KeyError, TypeError):
              print("Nenhuma vulnerabilidade crítica encontrada ou erro ao ler o arquivo."); exit(0)
          
          if not cve_id:
              print("Nenhuma vulnerabilidade encontrada nos resultados do OSV."); exit(0)

          original_req_line = ""
          with open(requirements_path, 'r') as f:
              for line in f:
                  if line.strip().lower().startswith(pkg_name.lower()):
                      original_req_line = line.strip()
                      break
          if not original_req_line:
              print(f"Biblioteca {pkg_name} não encontrada em {requirements_path}."); exit(1)

          prompt = f"Analisando um projeto Python, a vulnerabilidade '{cve_id}' foi encontrada na biblioteca '{pkg_name}', versão '{installed_version}'. O arquivo de dependências contém a linha: '{original_req_line}'. Qual é a menor atualização de versão para '{pkg_name}' que corrige essa falha e respeita a regra de versionamento original? Responda APENAS com a nova linha para o arquivo de dependências."
          genai.configure(api_key=os.environ["GEMINI_API_KEY"])
          model = genai.GenerativeModel('gemini-1.5-pro-latest')
          response = model.generate_content(prompt)
          corrected_line = response.text.strip().replace("`", "")
          print(f"Gemini sugeriu a correção: '{corrected_line}'")

          # Substitui a linha exata para evitar correspondências parciais
          subprocess.run(["sed", "-i", f"s|^{original_req_line}$|{corrected_line}|", requirements_path], check=True)

          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"commit_message=fix(bot): upgrade {pkg_name} to remediate {cve_id}\n")
          EOF
      - name: 7. Instalar dependências corrigidas e de teste
        id: tests
        if: steps.genai_fix.outputs.commit_message != ''
        run: |
          echo "Instalando dependências corrigidas..."
          pip install -r ${{ steps.config.outputs.requirements_file }}
          echo "Instalando dependências de teste..."
          pip install -r ${{ steps.config.outputs.test_requirements_file }}
          echo "Rodando a suíte de testes..."
          pytest tests/

      - name: 8. Commitar e Empurrar a Correção para o PR
        if: steps.tests.outcome == 'success'
        run: |
          git config --global user.name 'GenAI Security Bot'
          git config --global user.email 'bot@users.noreply.github.com'
          git commit -am "${{ steps.genai_fix.outputs.commit_message }}"
          git push
        working-directory: .
