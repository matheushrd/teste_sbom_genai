name: GenAI Security Check on Merge

on:
  pull_request:
    branches: ['main']
    types: [closed]

permissions:
  contents: write
  pull-requests: write

jobs:
  validate-and-secure:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./app

    steps:
      - name: Checkout código do PR mergeado
        uses: actions/checkout@v4

      - name: Ler configuração do pipeline
        id: config
        run: |
          echo "python_version=$(yq '.python_version' ../ci_config.yml)" >> "$GITHUB_OUTPUT"
          echo "requirements_file=$(yq '.requirements_files[0]' ../ci_config.yml)" >> "$GITHUB_OUTPUT"
          echo "test_requirements_file=$(yq '.requirements_files[1]' ../ci_config.yml)" >> "$GITHUB_OUTPUT"

      - name: Setup do Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.config.outputs.python_version }}
          cache: 'pip'
          cache-dependency-path: app/${{ steps.config.outputs.requirements_file }}

      - name: Instalar dependências + teste inicial
        id: initial_test
        run: |
          pip install -r ${{ steps.config.outputs.requirements_file }}
          pip install -r ${{ steps.config.outputs.test_requirements_file }}
          pytest tests/

      - name: Escanear segurança com Trivy
        id: trivy_scan
        if: steps.initial_test.outcome == 'success'
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: './app'
          format: 'json'
          output: 'trivy-results.json'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          continue-on-error: true

      - name: Verificar se há vulnerabilidades críticas
        id: vuln_check
        if: steps.trivy_scan.outcome == 'failure'
        run: |
          if jq '.[0].Vulnerabilities | length > 0' trivy-results.json; then
            echo "has_vuln=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_vuln=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Aplicar correção com Gemini
        id: genai_fix
        if: steps.vuln_check.outputs.has_vuln == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          REQUIREMENTS_FILE_PATH: app/${{ steps.config.outputs.requirements_file }}
        run: |
          pip install google-generativeai
          python - << 'EOF'
          import os, json, subprocess, google.generativeai as genai

          req_path = os.environ["REQUIREMENTS_FILE_PATH"]
          with open('trivy-results.json') as f: data = json.load(f)
          vuln = data[0]['Vulnerabilities'][0]
          pkg, ver, cve = vuln['PkgName'], vuln['InstalledVersion'], vuln['VulnerabilityID']

          with open(req_path) as f:
              original_line = next((l.strip() for l in f if l.startswith(pkg)), '')

          if not original_line:
              print(f"Biblioteca {pkg} não encontrada."); exit(1)

          prompt = f"A vulnerabilidade '{cve}' foi encontrada na biblioteca '{pkg}', versão '{ver}'. Corrija a linha '{original_line}' com a menor versão segura mantendo o versionamento."
          genai.configure(api_key=os.environ["GEMINI_API_KEY"])
          response = genai.GenerativeModel('gemini-1.5-pro-latest').generate_content(prompt)
          new_line = response.text.strip()
          subprocess.run(["sed", "-i", f"s|{original_line}|{new_line}|g", req_path])
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f"pkg={pkg}\ncve={cve}\nfixed_line={new_line}\n")
          EOF

      - name: Reinstalar deps corrigidas e reexecutar testes
        id: retest
        if: steps.genai_fix.outputs.fixed_line != ''
        run: |
          pip install -r ${{ steps.config.outputs.requirements_file }}
          pip install -r ${{ steps.config.outputs.test_requirements_file }}
          pytest tests/

      - name: Criar PR com correção de segurança
        if: steps.retest.outcome == 'success'
        run: |
          git config --global user.name 'GenAI Security Bot'
          git config --global user.email 'bot@users.noreply.github.com'
          git checkout -b security/fix-${{ steps.genai_fix.outputs.pkg }}
          git commit -am "fix(security): upgrade ${{ steps.genai_fix.outputs.pkg }} to remediate ${{ steps.genai_fix.outputs.cve }}"
          git push origin security/fix-${{ steps.genai_fix.outputs.pkg }}
          gh pr create \
            --title "fix(security): ${{ steps.genai_fix.outputs.pkg }}" \
            --body "Corrige automaticamente a vulnerabilidade ${{ steps.genai_fix.outputs.cve }} com ajuda do Gemini." \
            --base main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

