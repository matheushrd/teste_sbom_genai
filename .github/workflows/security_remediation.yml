name: GenAI Security Auto-Remediation on PR

on:
  pull_request:
    branches: ['main']
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  scan-and-remediate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./app

    steps:
    
      - name: 1. Checkout do código-fonte
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: 2. Ler configuração do pipeline
        id: config
        run: |
          echo "python_version=$(yq '.python_version' ../ci_config.yml)" >> "$GITHUB_OUTPUT"
          echo "requirements_file=$(yq '.requirements_files[0]' ../ci_config.yml)" >> "$GITHUB_OUTPUT"
          echo "test_requirements_file=$(yq '.requirements_files[1]' ../ci_config.yml)" >> "$GITHUB_OUTPUT"

      - name: 2.5. Rodar testes antes da verificação
        run: |
          pip install -r ${{ steps.config.outputs.test_requirements_file }}
          pytest tests/

      - name: 3. Setup do ambiente Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.config.outputs.python_version }}
          cache: 'pip'
          cache-dependency-path: app/${{ steps.config.outputs.requirements_file }}

      - name: 4. Instalar dependências
        run: |
          # Apenas instala as dependências. O 'pip freeze' não é necessário.
          pip install -r ${{ steps.config.outputs.requirements_file }}
          pip install cyclonedx-bom # Instala a ferramenta para a próxima etapa

      - name: 4.1 Gerar SBOM com CycloneDX
        run: |
          # Cria o diretório e gera o SBOM diretamente do requirements.txt
          mkdir -p app
          cyclonedx-py requirements -i ${{ steps.config.outputs.requirements_file }} -o ./app/cyclonedx.json

      - name: 4.2 Validar SBOM (Método Manual)
        run: |
          # Baixa a ferramenta de linha de comando (CLI) do CycloneDX
          curl -L -o cyclonedx-cli https://github.com/CycloneDX/cyclonedx-cli/releases/latest/download/cyclonedx-linux-x64

          # Dá permissão de execução para a ferramenta
          chmod +x cyclonedx-cli

          # Executa a validação no seu arquivo SBOM
          ./cyclonedx-cli validate --input-file ./app/cyclonedx.json

      - name: 4.3.1. Verificar arquivos existentes
        run: |
          echo "Verificando o conteúdo antes do upload:"
          ls -R ./app
          cat ./app/cyclonedx.json

      - name: 5.1 Instalar Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin

      - name: 5.2 Escanear SBOM com Trivy
        id: vulnerability_scan
        continue-on-error: true
        run: |
          # Executa o scan e salva o resultado em formato JSON para processamento
          trivy sbom ./app/cyclonedx.json --format json --output trivy-results.json --severity MEDIUM,HIGH,CRITICAL
          
          # Também executa em formato table para exibição
          trivy sbom ./app/cyclonedx.json --exit-code 1 --severity MEDIUM,HIGH,CRITICAL --format table

      - name: 5.3. Verificar arquivos existentes
        run: |
          echo "Verificando o conteúdo após o escaneamento:"
          echo "Listando arquivos no diretório app/:"
          ls -la ./
          echo "Conteúdo do arquivo requirements.txt:"
          if [ -f "${{ steps.config.outputs.requirements_file }}" ]; then
            cat "${{ steps.config.outputs.requirements_file }}"
          else
            echo "Arquivo ${{ steps.config.outputs.requirements_file }} não encontrado!"
          fi
          echo "Verificando se trivy-results.json foi criado:"
          if [ -f "trivy-results.json" ]; then
            echo "✅ trivy-results.json foi criado com sucesso"
            echo "Primeiras linhas do arquivo:"
            head -20 trivy-results.json
          else
            echo "❌ trivy-results.json não foi encontrado"
          fi
          

      - name: 6. Gemini sugere e aplica a correção com Trivy
        id: genai_fix
        if: steps.vulnerability_scan.outcome == 'failure'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          REQUIREMENTS_FILE_PATH: ${{ steps.config.outputs.requirements_file }}
          GEMINI_VERSION: ${{ secrets.GEMINI_VERSION }}
        run: |
          pip install google-generativeai
          python - << 'EOF'
          import os, json, google.generativeai as genai, subprocess, re

          requirements_path = os.environ["REQUIREMENTS_FILE_PATH"]
          pkg_name, installed_version, cve_id, fixed_version = None, None, None, None

          print(f"Procurando arquivo de requisitos em: {requirements_path}")
          print(f"Diretório atual: {os.getcwd()}")
          print(f"Arquivos no diretório: {os.listdir('.')}")

          try:
              # Lê o resultado do Trivy em formato JSON
              with open('trivy-results.json', 'r') as f: 
                  data = json.load(f)
              
              print(f"Estrutura do JSON Trivy: {list(data.keys())}")
              
              # Processa a estrutura do JSON do Trivy
              for result in data.get('Results', []):
                  print(f"Tipo do resultado: {result.get('Type')}")
                  if result.get('Type') == 'python-pkg' and result.get('Vulnerabilities'):
                      vulnerability = result['Vulnerabilities'][0]  # Pega a primeira vulnerabilidade
                      pkg_name = vulnerability.get('PkgName')
                      installed_version = vulnerability.get('InstalledVersion')
                      cve_id = vulnerability.get('VulnerabilityID')
                      fixed_version = vulnerability.get('FixedVersion', '')
                      print(f"Vulnerabilidade encontrada: {cve_id} em {pkg_name}=={installed_version}")
                      if fixed_version:
                          print(f"Versão corrigida disponível: {fixed_version}")
                      break
                      
          except (IOError, IndexError, KeyError, TypeError) as e:
              print(f"Erro ao processar resultados do Trivy: {e}")
              # Debug: vamos ver o conteúdo do arquivo
              try:
                  with open('trivy-results.json', 'r') as f:
                      content = f.read()
                      print(f"Conteúdo do trivy-results.json: {content[:500]}...")
              except:
                  print("Não foi possível ler o arquivo trivy-results.json")
              exit(0)
          
          if not cve_id:
              print("Nenhuma vulnerabilidade encontrada nos resultados do Trivy.")
              exit(0)

          # Verifica se o arquivo requirements.txt existe
          if not os.path.exists(requirements_path):
              print(f"Arquivo {requirements_path} não encontrado!")
              print(f"Arquivos disponíveis: {os.listdir('.')}")
              exit(1)

          # Encontra a linha no requirements.txt
          original_req_line = ""
          with open(requirements_path, 'r') as f:
              content = f.read()
              print(f"Conteúdo do {requirements_path}:")
              print(content)
              
              for line in content.splitlines():
                  line_stripped = line.strip()
                  if not line_stripped or line_stripped.startswith('#'):
                      continue
                  
                  # Verifica diferentes formatos de especificação de pacote
                  if (line_stripped.lower().startswith(pkg_name.lower() + '==') or 
                      line_stripped.lower().startswith(pkg_name.lower() + '>=') or
                      line_stripped.lower().startswith(pkg_name.lower() + '~=') or
                      line_stripped.lower() == pkg_name.lower()):
                      original_req_line = line_stripped
                      print(f"Linha encontrada: {original_req_line}")
                      break
                      
          if not original_req_line:
              print(f"Biblioteca {pkg_name} não encontrada em {requirements_path}.")
              exit(1)

          # Monta o prompt para o Gemini
          fixed_info = f" A versão corrigida sugerida é '{fixed_version}'." if fixed_version else ""
          prompt = f"""Analisando um projeto Python, a vulnerabilidade '{cve_id}' foi encontrada na biblioteca '{pkg_name}', versão '{installed_version}'.{fixed_info}
          
          O arquivo de dependências contém a linha: '{original_req_line}'
          
          Qual é a menor atualização de versão para '{pkg_name}' que corrige essa vulnerabilidade e respeita a regra de versionamento original?
          
          Responda APENAS com a nova linha para o arquivo de dependências, sem explicações adicionais."""

          # Chama o Gemini
          genai.configure(api_key=os.environ["GEMINI_API_KEY"])
          model = genai.GenerativeModel('os.environ["GEMINI_VERSION"])
          response = model.generate_content(prompt)
          corrected_line = response.text.strip().replace("`", "").replace("```", "")
          print(f"Gemini sugeriu a correção: '{corrected_line}'")

          # Substitui a linha no arquivo requirements.txt
          with open(requirements_path, 'r') as f:
              content = f.read()
          
          # Usa regex para substituir a linha exata
          pattern = re.escape(original_req_line)
          new_content = re.sub(f"^{pattern}$", corrected_line, content, flags=re.MULTILINE)
          
          with open(requirements_path, 'w') as f:
              f.write(new_content)

          print(f"Arquivo {requirements_path} atualizado!")
          
          # Mostra o conteúdo atualizado
          with open(requirements_path, 'r') as f:
              print(f"Novo conteúdo do {requirements_path}:")
              print(f.read())

          # Define a mensagem do commit
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"commit_message=fix(security): upgrade {pkg_name} to remediate {cve_id}\n")
              f.write(f"vulnerability_fixed=true\n")
          EOF
      - name: 7. Instalar dependências corrigidas e executar testes
        id: tests
        if: steps.genai_fix.outputs.vulnerability_fixed == 'true'
        run: |
          echo "Instalando dependências corrigidas..."
          pip install -r ${{ steps.config.outputs.requirements_file }}
          
          echo "Instalando dependências de teste..."
          pip install -r ${{ steps.config.outputs.test_requirements_file }}
          
          echo "Executando a suíte de testes..."
          python -m pytest tests/ -v --tb=short

      - name: 8. Verificar se a correção resolveu a vulnerabilidade
        id: verify_fix
        if: steps.tests.outcome == 'success'
        continue-on-error: true
        run: |
          echo "Verificando se a vulnerabilidade foi corrigida..."
          # Gera novo SBOM
          trivy fs --format cyclonedx ${{ steps.config.outputs.app_path }} --output ./app/cyclonedx-fixed.json
          
          # Verifica se ainda há vulnerabilidades
          trivy sbom ./app/cyclonedx-fixed.json --format json --output trivy-results-fixed.json --severity MEDIUM,HIGH,CRITICAL
          trivy sbom ./app/cyclonedx-fixed.json --exit-code 1 --severity MEDIUM,HIGH,CRITICAL --format table

      - name: 9. Commitar e Empurrar a Correção
        if: steps.tests.outcome == 'success' && steps.verify_fix.outcome == 'success'
        run: |
          git config --global user.name 'GenAI Security Bot'
          git config --global user.email 'bot@users.noreply.github.com'
          git add ${{ steps.config.outputs.requirements_file }}
          git commit -m "${{ steps.genai_fix.outputs.commit_message }}"
          git push

      - name: 10. Comentar no PR sobre a correção
        if: github.event_name == 'pull_request' && steps.tests.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const message = `🔒 **Correção de Segurança Aplicada Automaticamente**
            
            Uma vulnerabilidade foi detectada e corrigida automaticamente:
            - **Commit**: ${{ steps.genai_fix.outputs.commit_message }}
            - **Status dos Testes**: ✅ Aprovado
            - **Verificação de Segurança**: ${{ steps.verify_fix.outcome == 'success' && '✅ Vulnerabilidade corrigida' || '⚠️ Necessita revisão manual' }}
            
            A correção foi aplicada pelo GenAI Security Bot.`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: message
            });