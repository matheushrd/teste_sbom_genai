name: Security Remediation CI

on:
  pull_request:
    branches:
      - main

jobs:
  security-remediation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt
          pip install -r app/requirements_test.txt

      - name: Run tests
        id: tests
        run: pytest app/tests/

      - name: Install SBOM Generator
        run: pip install cyclonedx-python-lib

      - name: Generate SBOM
        run: cyclonedx-py -r app/requirements.txt --format json -o sbom.json

      - name: Scan SBOM with Trivy
        id: trivy_scan
        uses: aquasecurity/trivy-action@master
        with:
          input: 'sbom.json'
          format: 'json'
          output: 'trivy-results.json'
          ignore-unfixed: true
          severity: 'HIGH,CRITICAL'
        # Continue on error so we can process the results
        continue-on-error: true

      - name: Generate and Apply Fix with GenAI
        id: genai_fix
        run: |
          # This is a placeholder for the GenAI remediation script
          # 1. Parse trivy-results.json to find vulnerabilities
          # 2. Construct a prompt for the Gemini API to ask for updated packages
          # 3. Call the Gemini API (requires a GEMINI_API_KEY secret)
          # 4. Parse the Gemini response and update app/requirements.txt
          # For now, we'll simulate a change if vulnerabilities are found
          if [[ -s trivy-results.json ]]; then
            echo "Vulnerabilities found. Simulating a fix by GenAI."
            # Placeholder: In a real scenario, you would parse the output and update intelligently
            # For this example, let's assume we are updating pandas
            sed -i 's/pandas==1.3.5/pandas==1.5.3/' app/requirements.txt
            echo "changes_applied=true" >> $GITHUB_OUTPUT
          else
            echo "No vulnerabilities found."
            echo "changes_applied=false" >> $GITHUB_OUTPUT
          fi
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Install updated dependencies
        if: steps.genai_fix.outputs.changes_applied == 'true'
        run: |
          pip install -r app/requirements.txt

      - name: Run tests again with updated dependencies
        if: steps.genai_fix.outputs.changes_applied == 'true'
        run: pytest app/tests/

      - name: Create Pull Request with fixes
        if: steps.genai_fix.outputs.changes_applied == 'true'
        uses: create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "fix(deps): Update dependencies to fix vulnerabilities"
          title: "Automatic Security Fixes"
          body: |
            This PR was automatically generated to fix security vulnerabilities found by Trivy.
            Please review the changes and merge if they are correct.
          branch: "security-fixes"
